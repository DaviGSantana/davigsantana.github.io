# Name of the workflow
name: Deploy Hexo to GitHub Pages
 
on:
  # Trigger the workflow on pushes to the 'main' branch
  push:
    branches:
      - main
 
  # Allows you to run this workflow manually
  workflow_dispatch:
 
# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checks out your 'main' branch
      - name: Checkout repository
        uses: actions/checkout@v4
 
      # 2. Sets up Node.js for Hexo
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
 
      # 3. Installs Hexo and your theme dependencies
      - name: Install dependencies
        run: npm ci
 
      # 4. Builds the site using Hexo
      - name: Generate static files
        run: npm run build # This runs 'hexo generate'
 
      # 5. Prepares the built files (from the 'public' folder) as a Pages artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
 
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 6. Publishes the artifact using the official GitHub Pages deployment action
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
 